<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英文公主王國</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff5fa8;--pk2:#ff9fd0;--pu:#9b5de5;--pu2:#c9a7ff;--gd:#ffc93c;--ink:#5a2a6e;--glass:rgba(255,255,255,.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka','Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:#ffe3f3;
background-image:radial-gradient(circle at 12% 8%,rgba(255,255,255,.9) 0,transparent 22%),radial-gradient(circle at 88% 18%,rgba(255,233,168,.9) 0,transparent 24%),radial-gradient(circle at 50% 105%,#c9b6ff 0,transparent 55%),linear-gradient(160deg,#ffcfe9 0%,#ead6ff 48%,#cbe7ff 100%);
background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.tw{position:absolute;color:#fff;animation:tw 3s ease-in-out infinite;text-shadow:0 0 8px #fff,0 0 16px #ffc6ee}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(35deg)}}
.bub{position:absolute;bottom:-60px;animation:up linear infinite;opacity:.5}
@keyframes up{to{transform:translateY(-120vh) translateX(40px) rotate(25deg)}}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:12px 16px 104px}
.title{font-size:clamp(28px,6.5vw,48px);font-weight:900;text-align:center;margin:6px 0 4px;line-height:1.15;
background:linear-gradient(90deg,#ff3f9a,#ffae00,#b06bff,#36b9ff,#ff3f9a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite;
filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 8px 12px rgba(176,107,255,.35))}
.sub{text-align:center;font-weight:700;color:#8a4fb0;margin:0 0 12px}
@keyframes shim{to{background-position:300% 0}}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;border:3px solid #fff;
box-shadow:0 12px 34px rgba(155,93,229,.22),inset 0 0 0 2px rgba(255,201,60,.55);padding:16px;margin:12px 0}
.btn{position:relative;overflow:hidden;border:3px solid #fff;border-radius:999px;padding:12px 26px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;
background:linear-gradient(135deg,#ff6fb5,#b06bff);box-shadow:0 6px 0 #a54bc9,0 10px 22px rgba(176,107,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a54bc9}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.gold{background:linear-gradient(135deg,#ffd75e,#ff9f1c);box-shadow:0 6px 0 #d07a00,0 10px 22px rgba(255,159,28,.4)}
.btn.mint{background:linear-gradient(135deg,#5fe0b8,#36b9ff);box-shadow:0 6px 0 #1f8fb8,0 10px 22px rgba(54,185,255,.35)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 5px 0 #e3b8e8;text-shadow:none}
.btn.sm{font-size:16px;padding:8px 16px}
.btn.big{font-size:24px;padding:16px 34px}
.btn:disabled{filter:grayscale(.7);opacity:.6}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* top bar */
.top{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);border:3px solid #fff;border-radius:24px;padding:6px 12px;box-shadow:0 8px 24px rgba(155,93,229,.2)}
.top .av{width:46px;height:54px;flex:none;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle,#fff 30%,#ffd6f0);border-radius:50%;overflow:hidden;border:2px solid #ffd27a}
.top .who{flex:1;min-width:0}
.top .nm{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .rk{font-size:13px;color:#b0479a;font-weight:700}
.xpbar{height:10px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px #ffc2e2;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7ec4,#ffd166,#b78cff);transition:width .5s}
.chip{background:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #f0c1e4;white-space:nowrap}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:20;display:flex;gap:4px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border:3px solid #fff;border-radius:26px;padding:6px;box-shadow:0 10px 30px rgba(155,93,229,.3);width:min(560px,calc(100% - 20px))}
.nav button{flex:1;border:0;background:transparent;border-radius:18px;padding:6px 2px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button b{font-size:24px;line-height:1.1}
.nav button.on{background:linear-gradient(135deg,#ffe0f2,#eadcff);box-shadow:inset 0 0 0 2px #ffb6dd}

/* hero banner */
.banner{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.bubble{position:relative;background:#fff;border-radius:22px;padding:10px 14px;font-weight:700;max-width:300px;box-shadow:0 6px 18px rgba(155,93,229,.2);border:3px solid #ffd6f0}
.bubble::before{content:'';position:absolute;left:-14px;top:24px;border:8px solid transparent;border-right:10px solid #fff}
.pwrap{position:relative;display:inline-block;animation:float 3s ease-in-out infinite}
.pwrap .pet{position:absolute;right:-18px;bottom:6px;font-size:34px;animation:float 2.2s ease-in-out infinite reverse;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.pwrap .acc{position:absolute;left:-12px;top:30%;display:flex;flex-direction:column;gap:2px;font-size:20px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.princess{overflow:visible;filter:drop-shadow(0 8px 10px rgba(155,93,229,.3))}

/* map */
.map{position:relative;padding:6px 0}
.isle-row{display:flex;margin:-6px 0}
.isle-row.l{justify-content:flex-start;padding-left:4%}
.isle-row.r{justify-content:flex-end;padding-right:4%}
.isle-row.c{justify-content:center}
.isle{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:170px;color:var(--ink);padding:0}
.orb{position:relative;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:5px solid #fff;
box-shadow:0 0 0 4px rgba(255,201,60,.7),0 14px 30px rgba(155,93,229,.35),inset 0 -12px 24px rgba(255,255,255,.6)}
.orb::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:3px dashed rgba(255,255,255,.95);animation:spin 14s linear infinite}
.orb::after{content:'';position:absolute;top:12px;left:24px;width:36px;height:20px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-25deg)}
.orb span{font-size:62px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
@keyframes spin{to{transform:rotate(360deg)}}
.isle .nm{margin-top:10px;background:#fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:17px;box-shadow:0 4px 0 #f0c1e4;border:2px solid #ffe08a}
.isle .st{font-size:18px;letter-spacing:2px;margin-top:2px;text-shadow:0 2px 0 #fff}
.isle.lock .orb{filter:grayscale(.85) brightness(1.05);opacity:.7}
.isle.lock .orb::before{animation:none;border-color:rgba(255,255,255,.5)}
.lockic{position:absolute;bottom:-6px;right:-6px;font-size:30px;background:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.path{text-align:center;font-size:18px;letter-spacing:10px;opacity:.85;margin:-2px 0;color:#fff;text-shadow:0 0 6px #ff9fd0}
.isle.next .orb{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(255,201,60,.7),0 14px 30px rgba(155,93,229,.35)}50%{box-shadow:0 0 0 8px rgba(255,201,60,.95),0 0 40px rgba(255,111,181,.8)}}

/* kingdom */
.kban{border-radius:30px;padding:18px;text-align:center;border:4px solid #fff;box-shadow:0 14px 30px rgba(155,93,229,.25);position:relative;overflow:hidden}
.kban .ic{font-size:76px;animation:float 3s ease-in-out infinite}
.kban h2{margin:2px 0;font-size:32px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(155,63,180,.55),0 0 18px rgba(255,255,255,.8)}
.kban .en{font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(155,63,180,.5)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.mode{border:4px solid #fff;border-radius:26px;padding:16px 6px;cursor:pointer;color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.18);box-shadow:0 7px 0 rgba(120,60,160,.35),0 12px 24px rgba(155,93,229,.3);transition:transform .1s}
.mode:active{transform:translateY(4px)}
.mode b{display:block;font-size:46px;margin-bottom:4px}
.mode small{display:block;font-size:13px;font-weight:700;opacity:.95}
.m1{background:linear-gradient(145deg,#ff7aa8,#ff3f7f)}
.m2{background:linear-gradient(145deg,#ffcf5c,#ff9b3d)}
.m3{background:linear-gradient(145deg,#7fd8ff,#8a7dff)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.wcell{background:#fff;border:3px solid #ffe0f1;border-radius:20px;padding:8px 4px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #f6c9e6}
.wcell:active{transform:translateY(3px)}
.wcell .opic{height:64px;font-size:48px}
.wcell .e{font-weight:700;font-size:16px;line-height:1.1}
.wcell .z{font-size:13px;color:#a05b9c}

/* pictures */
.pic{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;line-height:1;vertical-align:middle}
.pic svg{width:100%;height:100%;overflow:visible}
.emo{font-size:1em;line-height:1;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.twobox{display:inline-flex;align-items:center;justify-content:center}
.twobox .pic{width:.8em;height:.8em;font-size:.82em;margin:0 -.05em}
.numb{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;border-radius:30%;font-size:.72em;font-weight:700;color:#fff;
background:linear-gradient(145deg,#ff8cc6,#9b6bff);border:3px solid #fff;box-shadow:0 4px 10px rgba(155,93,229,.35);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.bigletter{font-size:88px;font-weight:700;background:linear-gradient(180deg,#ff5fa8,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #fff)}
.letopt{font-size:46px;font-weight:700;color:#9b3fd0}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:8px;vertical-align:-3px;border:2px solid #ddd}

/* battle */
.battle{border-radius:30px;padding:10px 10px 14px;border:4px solid #fff;box-shadow:0 14px 34px rgba(155,93,229,.3);position:relative;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bhead .btn,.bhead .chip{white-space:nowrap}
@media (max-width:560px){.bhead .btn.sm{padding:6px 10px;font-size:14px}.bhead .chip{font-size:13px;padding:4px 8px}}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:space-between;height:200px;padding:0 3%;margin-top:4px}
.stage::after{content:'';position:absolute;left:4%;right:4%;bottom:6px;height:22px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px);z-index:0}
.side{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.hearts{font-size:18px;letter-spacing:-1px;background:rgba(255,255,255,.8);padding:2px 8px;border-radius:999px}
.hero.hurt{animation:shake .45s}
.hero.cast{animation:hop .4s}
.mname{font-weight:900;background:#fff;border-radius:999px;padding:2px 12px;font-size:15px;box-shadow:0 3px 0 #f0c1e4}
.hp{width:132px;height:16px;background:#fff;border-radius:9px;box-shadow:inset 0 0 0 2px #ffc2dd;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5f8f,#ffb86b);transition:width .4s}
.mon{font-size:92px;line-height:1;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 10px 6px rgba(0,0,0,.18))}
.mon.boss{font-size:118px}
.mon.hit{animation:hit .5s}
.mon.lunge{animation:lunge .5s}
.mon.poof{animation:poof .7s forwards}
.mon.enter{animation:enter .6s}
.crown-boss{position:absolute;top:-6px;font-size:26px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes hit{0%{transform:translateX(0);filter:brightness(1)}25%{transform:translateX(14px) rotate(10deg);filter:brightness(2.2) saturate(0)}50%{transform:translateX(-10px)}100%{transform:translateX(0)}}
@keyframes lunge{40%{transform:translateX(-60px) scale(1.15)}100%{transform:translateX(0)}}
@keyframes poof{to{transform:scale(1.8) rotate(40deg);opacity:0;filter:brightness(3)}}
@keyframes enter{from{transform:translateX(120px) scale(.3);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes hop{50%{transform:translateY(-16px) scale(1.05)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.vs{position:relative;z-index:1;align-self:center;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px #ff5fa8,0 3px 0 #b04ac0}
.magic{position:absolute;z-index:5;left:20%;bottom:42%;font-size:44px;pointer-events:none;animation:fly .5s ease-in forwards}
@keyframes fly{to{left:72%;bottom:58%;transform:scale(1.7) rotate(360deg)}}
.boom{position:absolute;z-index:6;right:12%;bottom:40%;font-size:64px;pointer-events:none;animation:boom .6s forwards}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.8);opacity:0}}
.dmg{position:absolute;z-index:6;right:16%;top:4%;font-size:30px;font-weight:900;color:#ff3f9a;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:rise 1s forwards}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
.combo{position:absolute;z-index:6;left:50%;top:30%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#ffae00;text-shadow:0 3px 0 #fff,0 0 12px #fff;animation:rise 1.2s forwards;white-space:nowrap}
.qcard{background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:26px;padding:12px;margin-top:8px;box-shadow:0 8px 22px rgba(155,93,229,.2);animation:zoomin .3s}
.qzh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:19px;color:#8a3fb0}
.replay{border:0;background:linear-gradient(135deg,#ffe0f2,#e8dcff);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #e2b6e6}
.qcenter{text-align:center;font-size:96px;min-height:80px;margin:6px 0;display:flex;justify-content:center;align-items:center}
.qen{text-align:center;font-size:26px;font-weight:700;color:#5a2a6e;margin-bottom:8px}
.bigspeak{width:120px;height:120px;border-radius:50%;border:5px solid #fff;font-size:56px;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff,#ffc6e8 40%,#c39bff);box-shadow:0 0 0 6px rgba(255,201,60,.6),0 12px 26px rgba(155,93,229,.35);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.opts{display:grid;gap:12px}
.opts.pics.n4{grid-template-columns:repeat(4,1fr)}
.opts.pics.n3{grid-template-columns:repeat(3,1fr)}
.opts.pics.n2{grid-template-columns:repeat(2,1fr)}
.opts.words{grid-template-columns:1fr}
.opt{position:relative;background:#fff;border:4px solid #ffd6f0;border-radius:22px;padding:8px;cursor:pointer;font-size:24px;font-weight:700;color:var(--ink);box-shadow:0 6px 0 #f3b6dc;transition:transform .1s;display:flex;align-items:center;justify-content:center;flex-direction:column}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #f3b6dc}
.opt.words{flex-direction:row;justify-content:space-between;text-align:left;padding:12px 14px;min-height:62px}
.opt .opic{font-size:62px;height:90px;display:flex;align-items:center;justify-content:center}
.opt .olab{opacity:0;font-size:18px;min-height:22px;transition:opacity .3s}
.qcard.done .olab{opacity:1}
.osay{flex:none;font-size:22px;background:#fff0f8;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;margin-left:8px;box-shadow:0 3px 0 #f0c1e4}
.opt.right{border-color:#3ccf8e;background:#eafff4;box-shadow:0 6px 0 #2bb57a;animation:pop .45s}
.opt.right::after{content:'✔';position:absolute;top:-12px;right:-8px;background:#3ccf8e;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid #fff}
.opt.wrong{border-color:#ff6b8b;background:#fff0f3;animation:shake .4s}
.opt.gone{visibility:hidden}
.countbox{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:40px;max-width:360px}
.seq{display:flex;gap:12px;font-size:60px}
.seq span{background:#fff;border-radius:20px;padding:4px 16px;box-shadow:0 5px 0 #f0c1e4;font-weight:700;color:#9b3fd0}
.seq .qm{color:#ff5fa8;animation:pulse 1s infinite}
.bfoot{display:flex;justify-content:center;gap:10px;margin-top:10px}

/* cards */
.flip{perspective:1000px;width:min(320px,82vw);height:340px;margin:10px auto;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;border:5px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(155,93,229,.3)}
.face.f{background:radial-gradient(circle at 30% 20%,#fff,#ffe2f3 45%,#e6d6ff)}
.face.b{background:linear-gradient(160deg,#ff8cc6,#a77bff);color:#fff;transform:rotateY(180deg)}
.face .opic{font-size:130px;height:180px;display:flex;align-items:center}
.face .e{font-size:44px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.15);text-align:center;padding:0 10px}
.face .z{font-size:24px;font-weight:700;margin-top:6px}
.tip{font-size:14px;color:#a05b9c;font-weight:700}

/* speak */
.spk{text-align:center}
.spk .opic{font-size:110px;height:150px;display:flex;align-items:center;justify-content:center}
.spk .t{font-size:34px;font-weight:700}
.mic{width:130px;height:130px;border-radius:50%;border:6px solid #fff;font-size:60px;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff,#ff9fcf 45%,#ff4f9a);box-shadow:0 0 0 7px rgba(255,201,60,.6),0 14px 30px rgba(255,79,154,.4)}
.mic.on{animation:pulse .7s infinite;background:radial-gradient(circle at 35% 30%,#fff,#ff8a8a 45%,#ff2d55)}
.stars3{font-size:46px;letter-spacing:4px;min-height:56px}
.stars3 span{display:inline-block;animation:starIn .5s backwards}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}

/* misc */
.modal{position:fixed;inset:0;background:rgba(90,42,110,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}
.mbox{background:radial-gradient(circle at 50% 0,#fff,#ffeaf6 60%,#efe3ff);border:5px solid #fff;border-radius:32px;max-width:440px;width:100%;padding:20px;text-align:center;box-shadow:0 0 0 4px rgba(255,201,60,.7),0 20px 50px rgba(90,42,110,.4);animation:zoomin .35s;max-height:92vh;overflow:auto}
.mbox h2{margin:6px 0;font-size:30px;font-weight:900;color:#d63f96}
@keyframes zoomin{from{transform:scale(.6);opacity:0}}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-120px);z-index:80;background:#fff;border:3px solid #ffd27a;border-radius:999px;padding:10px 20px;font-weight:900;box-shadow:0 8px 24px rgba(155,93,229,.3);transition:transform .35s;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;top:-50px;z-index:70;font-size:28px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{border:4px solid #fff;border-radius:24px;background:rgba(255,255,255,.75);cursor:pointer;padding:6px 2px;box-shadow:0 6px 0 #ecc0e6;color:var(--ink);font-weight:900;font-size:15px}
.pcard.on{background:linear-gradient(160deg,#fff4c2,#ffd6f0);box-shadow:0 0 0 4px #ffc93c,0 6px 0 #e0a800;transform:scale(1.04)}
input.name{font:inherit;font-size:24px;font-weight:700;text-align:center;border:4px solid #ffd6f0;border-radius:999px;padding:8px 16px;width:220px;color:var(--ink);outline:none}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border:3px solid #ffe0f1;border-radius:22px;padding:10px;text-align:center;box-shadow:0 5px 0 #f6c9e6}
.item b{font-size:48px;display:block}
.item .n{font-weight:900}
.item .d{font-size:12px;color:#a05b9c;min-height:30px}
.sticker{background:#fff;border-radius:20px;padding:8px;text-align:center;border:3px dashed #ffc2e2}
.sticker b{font-size:44px;display:block}
.sticker.no b{filter:grayscale(1) brightness(1.6);opacity:.35}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.list{width:100%;border-collapse:collapse;font-size:15px}
.list td{padding:6px;border-bottom:1px dashed #f0c1e4}
h3{margin:4px 0 10px;font-size:20px;font-weight:900;color:#b0479a}
.seg button{border:3px solid #fff;background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 #f0c1e4}
.seg button.on{background:linear-gradient(135deg,#ff8cc6,#b06bff);color:#fff}
@media (max-width:560px){
 .modes{gap:8px}.mode{font-size:16px;padding:12px 2px}.mode b{font-size:38px}
 .opts.pics.n4{grid-template-columns:repeat(2,1fr)}
 .opt .opic{font-size:54px;height:76px}
 .stage{height:170px}.mon{font-size:76px}.mon.boss{font-size:96px}
 .qcenter{font-size:84px}.qen{font-size:22px}.opt{font-size:20px}
 .orb{width:110px;height:110px}.orb span{font-size:52px}.isle{width:150px}
 .pcards{grid-template-columns:repeat(2,1fr)}
 .hp{width:110px}
}

function normT(s){s=String(s).toLowerCase().replace(/[’`]/g,"'").replace(/-/g,' ');s=s.replace(/\bi'm\b/g,'i am').replace(/\bit's\b/g,'it is').replace(/\bthey're\b/g,'they are').replace(/\bisn't\b/g,'is not').replace(/\baren't\b/g,'are not').replace(/\bwhat's\b/g,'what is');
 let a=s.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>NUMN[w]||w);
 const out=[];for(let i=0;i<a.length;i++){if(/^[2-5]0$/.test(a[i])&&/^[1-9]$/.test(a[i+1]||'')){out.push(String(+a[i]+ +a[i+1]));i++;}else out.push(a[i]);}return out;}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function near(t,h){if(t===h)return true;if(t+'s'===h||h+'s'===t)return true;if(t.length>=4&&lev(t,h)<=1)return true;if(t.length>=7&&lev(t,h)<=2)return true;return false;}
function grade(target,alts){const tw=normT(target);let best=0,heard=alts[0]||'';const tj=tw.join('');
 alts.forEach(a=>{const aw=normT(a);if(aw.join('')===tj){best=1;heard=a;return;}let hit=0;const used=new Set();tw.forEach(t=>{const k=aw.findIndex((h,i)=>!used.has(i)&&near(t,h));if(k>=0){hit++;used.add(k);}});const r=hit/tw.length;if(r>best){best=r;heard=a;}});
 return {r:best,heard};}

 <div class="glass"><h3>🐾 魔法寵物</h3><div class="shop">${SHOP.map((it,i)=>it.pet?itemHTML(it,i):'').join('')}</div></div>
 <div class="glass"><h3>💎 可愛配件</h3><div class="shop">${SHOP.map((it,i)=>it.pet?'':itemHTML(it,i)).join('')}</div></div>
 <div class="glass"><h3>👑 換一位公主</h3><div class="pcards">${PR.map((p,i)=>`<button class="pcard ${S.pi===i?'on':''}" onclick="changeP(${i})">${princessSVG(i,rankIdx(),80)}<div>${p.icon} ${p.name}</div></button>`).join('')}</div></div>`+nav('shop');}
function itemHTML(it,i){const own=S.owned.includes(i);const on=it.pet?S.pet===i:S.wear.includes(i);
 return `<div class="item"><b>${it.e}</b><div class="n">${it.n}</div><div class="d">${it.d}</div>${own?`<button class="btn ${on?'ghost':'mint'} sm" onclick="wearIt(${i})">${on?(it.pet?'休息':'脫下'):(it.pet?'帶著':'戴上')}</button>`:`<button class="btn gold sm" onclick="buy(${i})">💎 ${it.p}</button>`}</div>`;}
function buy(i){const it=SHOP[i];if(S.gems<it.p){toast(`還差 💎 ${it.p-S.gems}，去打怪賺寶石吧！`);sayZh('寶石不夠喔，去打怪賺寶石吧！');sfx('bad');return;}S.gems-=it.p;S.owned.push(i);if(it.pet)S.pet=i;else S.wear.push(i);save();sfx('win');confetti(20);renderShop();sayZh(`買到${it.n}了！`);}
function wearIt(i){const it=SHOP[i];if(it.pet)S.pet=S.pet===i?null:i;else S.wear=S.wear.includes(i)?S.wear.filter(x=>x!==i):[...S.wear,i];save();sfx('pop');renderShop();}
function changeP(i){S.pi=i;save();sfx('pop');sayZhEn(PR[i].name,PR[i].cheer);renderShop();}

/* ===================== 貼紙簿 ===================== */
function renderDex(){VIEW='dex';let h='';const total=KD.length*3;
 KD.forEach((K,ki)=>{const ms=[...K.mons.map((m,i)=>[m,ki+'-'+i]),[K.boss,ki+'-b']];h+=`<div class="glass"><h3>${K.icon} ${K.name}</h3><div class="sgrid">${ms.map(([m,id])=>{const got=S.stickers.includes(id);return `<div class="sticker ${got?'':'no'}"><b>${m[0]}</b><div style="font-weight:700;font-size:14px">${got?m[1]:'？？？'}</div></div>`;}).join('')}</div></div>`;});
 $('#app').innerHTML=topbar()+`<div class="title" style="font-size:34px">📖 怪獸貼紙簿</div><div class="center"><span class="chip">收集了 ${S.stickers.filter(x=>x!=='mirror').length} / ${total} 張</span></div>${h}`+nav('dex');}

/* ===================== 家長專區 ===================== */
function renderParent(){VIEW='parent';const L=wrongList();const r=S.set.rate;
 $('#app').innerHTML=topbar()+`<div class="title" style="font-size:34px">⚙️ 家長專區</div>
 <div class="glass"><h3>🔊 英文語音速度</h3><div class="seg row" style="justify-content:flex-start">${[[.65,'慢慢'],[.8,'剛好'],[.95,'一般']].map(([v,t])=>`<button class="${Math.abs(r-v)<.01?'on':''}" onclick="setRate(${v})">${t}</button>`).join('')}<button onclick="say('This is a pencil.')">▶ 試聽</button></div>
 <h3 style="margin-top:14px">🗣️ 中文語音提示（題目說明會唸出來）</h3><div class="seg row" style="justify-content:flex-start"><button class="${S.set.zh?'on':''}" onclick="setZh(true)">開</button><button class="${S.set.zh?'':'on'}" onclick="setZh(false)">關</button></div>
 <h3 style="margin-top:14px">🔓 全部王國直接開放</h3><div class="seg row" style="justify-content:flex-start"><button class="${S.set.all?'on':''}" onclick="setAll(true)">開放</button><button class="${S.set.all?'':'on'}" onclick="setAll(false)">依序解鎖</button></div></div>
 <div class="glass"><h3>📚 課程對照（何嘉仁聯絡簿 8/31～11/9）</h3><table class="list">${KD.map((k,i)=>`<tr><td>${k.icon} ${k.name}</td><td>${k.src}</td><td>${'⭐'.repeat(S.stars[i]||0)||'—'}</td></tr>`).join('')}</table></div>
 <div class="glass"><h3>❌ 常錯單字（${L.length}）</h3>${L.length?`<table class="list">${L.slice(0,30).map(([en,o])=>`<tr><td><b>${en}</b></td><td>${o.zh}</td><td>${KD[o.ki].name}</td><td>錯 ${o.n} 次</td></tr>`).join('')}</table>`:'<p>目前沒有錯題 🎉</p>'}</div>
 <div class="glass"><h3>📊 進度</h3><p>等級 Lv.${level()}（${RANKS[rankIdx()][1]}）・經驗 ${S.xp}・寶石 ${S.gems}・星星 ${totalStars()}/${KD.length*3}・貼紙 ${S.stickers.filter(x=>x!=='mirror').length}/${KD.length*3}</p><p class="tip">進度存在這台電腦的瀏覽器裡；換電腦或清除瀏覽資料會重來。</p>
 <div class="row" style="justify-content:flex-start"><button class="btn ghost sm" onclick="renderStart()">✏️ 改名字／換公主</button><button class="btn ghost sm" onclick="resetAll()">🗑️ 清除全部進度</button></div></div>`+nav('parent');}
function setRate(v){S.set.rate=v;save();renderParent();say('This is a pencil.');}
function setZh(v){S.set.zh=v;save();renderParent();}
function setAll(v){S.set.all=v;save();renderParent();}
function resetAll(){if(confirm('確定要清除所有星星、寶石、寵物、貼紙和錯題紀錄嗎？這個動作不能復原。')){const n=S.name,p=S.pi,st=S.set;S=defaultSave();S.name=n;S.pi=p;S.set=st;S.story=true;save();renderMap();toast('已清除進度');}}

/* ===================== 啟動 ===================== */
if(S.pi==null)renderStart();else renderMap();
</script>
</body>
</html>
